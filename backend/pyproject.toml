[project]
name = "course-agent"
version = "1.0.0"
description = "智评导学 —— 基于多智能体协同的课程自主测评与导学系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "PyJWT>=2.9",
  "bcrypt>=4.2",
  "openai>=1.54",
  "pymupdf>=1.24.13",
  "python-pptx>=1.0.2",
  "python-docx>=1.1.2",
  "jieba>=0.42.1",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "structlog>=24.4",
  "python-multipart>=0.0.17",
  "tenacity>=9.0",
  "json-repair>=0.30",
  "bleach>=6.2",
  "httpx>=0.27",
  "orjson>=3.10",
]

[project.optional-dependencies]
# 生产/演示环境附加依赖：本地缺任何一个，系统都会走降级实现（见 docs/PROGRESS.md）
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.2"]
queue = ["celery>=5.4", "redis>=5.2"]
vector = ["chromadb>=0.5.20", "qdrant-client>=1.12"]
embedding = ["sentence-transformers>=3.3"]
agents = ["langgraph>=0.2.50", "langchain-core>=0.3.20"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "ruff>=0.8", "locust>=2.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents.prompts" = ["**/*.md"]
"app.adapters" = ["mock/fixtures/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app/rag", "app/agents"]
ignore_missing_imports = true
